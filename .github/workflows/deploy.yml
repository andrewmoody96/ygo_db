name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily card-data check at 09:17 UTC. Only redeploys if YGOPRODeck's data changed.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Re-download card data even if the version has not changed'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Get card data (reuses the deployed copy when YGOPRODeck has not changed)
        id: cards
        run: npm run card-data
        env:
          DEPLOYED_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
          FORCE_REFRESH: ${{ inputs.force_refresh && '1' || '' }}

      - name: Decide whether to deploy
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.cards.outputs.changed }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Card data unchanged; nothing to deploy."
          fi

      - run: npm test
        if: steps.decide.outputs.deploy == 'true'
      - run: npm run build
        if: steps.decide.outputs.deploy == 'true'
      - uses: actions/configure-pages@v5
        if: steps.decide.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.deploy == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
